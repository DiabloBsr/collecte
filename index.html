<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060b1c" />
    <title>Collecte — carnet de collecte de données</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Schibsted+Grotesk:ital,wght@0,400..700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0; background: #060b1c">
    <div id="root">
      <div id="boot-fallback" style="
        position: relative; z-index: 2;
        min-height: 70vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: Georgia, serif; color: #aab6da; text-align: center; padding: 24px;">
        <p style="font-size: 22px; color: #eaf0ff; margin: 0;">Collecte<span style="color:#f6c66d">.</span></p>
        <p style="margin: 0; font-size: 14px;">Chargement…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Filet anti-écran blanc : si l'application n'a pas pris la main au bout
         de 9 s (service worker périmé servant un bundle disparu, cache PWA
         corrompu), on purge caches + service workers et on recharge UNE fois. */
      (function () {
        var KEY = 'collecte.selfheal'
        var healing = false
        function heal() {
          if (healing) return
          healing = true
          if (sessionStorage.getItem(KEY)) return
          sessionStorage.setItem(KEY, '1')
          var done = function () { location.reload() }
          var jobs = []
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n) }))
            }))
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister() }))
            }))
          }
          Promise.all(jobs).then(done, done)
        }
        /* Un script de module qui échoue (bundle supprimé après déploiement)
           déclenche la réparation immédiatement, sans attendre. */
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && t.tagName === 'SCRIPT') heal()
          },
          true,
        )
        setTimeout(function () {
          if (!document.getElementById('boot-fallback')) return // app montée : OK
          if (sessionStorage.getItem(KEY)) {
            var el = document.getElementById('boot-fallback')
            if (el) {
              el.innerHTML =
                '<p style="font-size:22px;color:#eaf0ff;margin:0">Collecte<span style="color:#f6c66d">.</span></p>' +
                '<p style="margin:0;font-size:14px">Impossible de charger l\'application.<br>Vérifiez votre connexion, puis réessayez.</p>' +
                '<button onclick="location.reload()" style="font:inherit;font-size:14px;padding:9px 18px;border:none;border-radius:8px;background:#f6c66d;color:#241505;cursor:pointer">Réessayer</button>'
            }
            return
          }
          heal()
        }, 9000)
      })()
    </script>
  </body>
</html>
